name: Agent task
description: A scoped task intended for AI implementation and human PR review.
title: "[Agent] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or desired outcome
      description: Explain the user-visible result or bug, not the implementation alone.
      placeholder: What needs to change and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Describe independently verifiable outcomes.
      placeholder: |
        - Given ..., when ..., then ...
        - ...
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Test and screenshot expectations
      description: Which paths, viewports, and edge cases must be tested?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and out-of-scope work
      description: Include security, database, API, design, and compatibility constraints.
    validations:
      required: false
