name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-security:
    name: Supabase migration and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start disposable local Supabase
        run: npx supabase start >/dev/null 2>&1
      - name: Reset from migrations
        run: npx supabase db reset --no-seed
      - name: Run database security tests
        run: npx supabase test db
      - name: Stop local Supabase and remove volumes
        if: always()
        run: npx supabase stop --project-id one-killer-party --no-backup >/dev/null 2>&1 || true

  verify:
    name: Lint, TypeScript, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  browser-smoke:
    name: Playwright desktop and mobile smoke tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Run desktop and mobile Chromium smoke tests
        run: npm run test:e2e -- --project=desktop-chromium --project=mobile-chromium
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
