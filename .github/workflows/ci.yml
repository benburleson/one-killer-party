name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-security:
    name: Supabase migration and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start disposable local Supabase
        run: npx supabase start >/dev/null 2>&1
      - name: Reset from migrations
        run: npx supabase db reset --no-seed
      - name: Run database security tests
        run: npx supabase test db
      - name: Stop local Supabase and remove volumes
        if: always()
        run: npx supabase stop --project-id one-killer-party --no-backup >/dev/null 2>&1 || true

  verify:
    name: Lint, TypeScript, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  codeql:
    name: CodeQL JavaScript and TypeScript
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only this analysis job needs permission to publish SARIF findings.
    # Do not execute PR-provided npm lifecycle scripts in this privileged job.
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Initialize independent CodeQL scanning
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze with GitHub CodeQL
        uses: github/codeql-action/analyze@v4

  browser-smoke:
    name: Playwright desktop and mobile smoke tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Run desktop and mobile Chromium smoke tests
        run: npm run test:e2e -- --project=desktop-chromium --project=mobile-chromium
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  browser-integration:
    name: Local Supabase host integration (desktop and mobile)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start disposable local Supabase
        run: npx supabase start >/dev/null 2>&1
      - name: Reset from migrations
        run: npx supabase db reset --no-seed
      - name: Configure local-only credentials
        shell: bash
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { appendFileSync } = require("node:fs");
          const status = JSON.parse(execFileSync("npx", ["supabase", "status", "-o", "json"], { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] }));
          if (status.API_URL !== "http://127.0.0.1:54321" || !status.ANON_KEY || !status.SERVICE_ROLE_KEY ||
              [status.ANON_KEY, status.SERVICE_ROLE_KEY].some(value => /[\r\n]/.test(value))) {
            throw new Error("Local Supabase status is missing expected credentials or URL");
          }
          for (const value of [status.ANON_KEY, status.SERVICE_ROLE_KEY]) {
            console.log(`::add-mask::${value}`);
          }
          appendFileSync(process.env.GITHUB_ENV, [
            "APP_URL=http://127.0.0.1:3000",
            `NEXT_PUBLIC_SUPABASE_URL=${status.API_URL}`,
            `NEXT_PUBLIC_SUPABASE_ANON_KEY=${status.ANON_KEY}`,
            `SUPABASE_SERVICE_ROLE_KEY=${status.SERVICE_ROLE_KEY}`,
            "PLAYWRIGHT_LOCAL_SUPABASE=1",
            "NEXT_PUBLIC_TURNSTILE_SITEKEY=1x00000000000000000000AA",
            "",
          ].join("\n"));
          NODE
      - name: Production build with local Supabase
        run: npm run build
      - name: Run local integration tests
        run: npm run test:e2e -- --project=integration-desktop --project=integration-mobile
      # Screenshots below are taken only in verified synthetic states, before
      # any invitation or recovery token is displayed. Never upload all test-results.
      - name: Upload allowlisted host and guest UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lobby-integration-evidence
          path: |
            test-results/**/host-sign-in.png
            test-results/**/guest-waiting-lobby.png
            test-results/**/host-safe-roster.png
            test-results/**/guest-session-preserved.png
          if-no-files-found: error
          retention-days: 14
      - name: Stop local Supabase and remove volumes
        if: always()
        run: npx supabase stop --project-id one-killer-party --no-backup >/dev/null 2>&1 || true
